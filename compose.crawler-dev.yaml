name: iknowread-crawler-dev

services:
  crawler:
    image: iknowread-crawler:${APP_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.crawler
    restart: unless-stopped
    init: true
    dns:
      - ${CRAWLER_DNS:-1.1.1.1}
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWLER_API_TOKEN:?Set CRAWLER_API_TOKEN in fastapi-app/.env}
      CRAWL4AI_ALLOW_INTERNAL_URLS: "false"
    # Development-only endpoint. Binding to loopback keeps the crawler API off
    # the LAN while allowing the locally running FastAPI process to reach it.
    ports:
      - "127.0.0.1:11235:11235"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11235/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s
    mem_limit: 1400m
    memswap_limit: 1800m
    cpus: 1.25
    shm_size: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
