[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep the mandatory gate focused on defects: syntax, undefined names,
# duplicate definitions and unused imports. Broader style modernization can be
# done incrementally without hiding correctness failures in a large baseline.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # FastAPI intentionally evaluates Depends/File declarations in signatures.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# This import existed in the already-applied migration. Its byte checksum is a
# deployment invariant, so historical migration source must remain untouched.
"app/migrations/v001_unify_accounts.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
omit = [
    "app/migrations/*",
]
